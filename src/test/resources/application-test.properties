spring.application.name=medical-assistant-test

logging.level.root=WARN
logging.level.langchain4j=INFO

tavily.api-key=
xiaozhi.rag.answer-generator.mode=extractive
xiaozhi.rag.embedding.provider=deterministic
xiaozhi.rag.rerank.provider=none
xiaozhi.elasticsearch.endpoint=http://localhost:9200
xiaozhi.elasticsearch.username=
xiaozhi.elasticsearch.password=
xiaozhi.elasticsearch.index=xiaozhi-medical-knowledge-test
xiaozhi.elasticsearch.index.rebuild-on-startup=false
xiaozhi.elasticsearch.index.marker-dir=target/rag/elasticsearch-test
xiaozhi.elasticsearch.index.batch-size=10
xiaozhi.rag.pumch-department-pages.enabled=false
xiaozhi.multimodal.storage.directory=target/test-data/medical-files
xiaozhi.multimodal.upload.max-bytes=1048576
xiaozhi.multimodal.extraction.max-characters=10000
