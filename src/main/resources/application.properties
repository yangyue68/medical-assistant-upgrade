spring.application.name=medical-assistant
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.static-locations=classpath:/static/,file:./xiaozhi-ui/
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Private medical file upload and extraction.
spring.servlet.multipart.max-file-size=${MEDICAL_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MEDICAL_UPLOAD_MAX_REQUEST_SIZE:11MB}
xiaozhi.multimodal.storage.directory=${MEDICAL_FILE_STORAGE_DIR:data/uploads/medical}
xiaozhi.multimodal.upload.max-bytes=${MEDICAL_UPLOAD_MAX_BYTES:10485760}
xiaozhi.multimodal.extraction.max-characters=${MEDICAL_EXTRACTION_MAX_CHARACTERS:100000}
xiaozhi.multimodal.extraction.max-pdf-pages=${MEDICAL_EXTRACTION_MAX_PDF_PAGES:100}
xiaozhi.multimodal.ocr.provider=${MEDICAL_OCR_PROVIDER:paddle}
xiaozhi.multimodal.ocr.base-url=${MEDICAL_OCR_BASE_URL:http://127.0.0.1:18080}
xiaozhi.multimodal.ocr.endpoint=${MEDICAL_OCR_ENDPOINT:https://${QWEN_WORKSPACE_ID:ws-mkzuoap683tk9ki1}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions}
xiaozhi.multimodal.ocr.api-key=${MEDICAL_OCR_API_KEY:${QWEN_API_KEY:sk-ws-H.PXEPPIM.klPD.MEYCIQC8wGUM1lG_7XaFVN-ZYcV-_syEPBT_28COAbYw4f3cxwIhAItXBKrUt0kht_SQzj53K3bMBdf5_K_i74pDhUeFRNlu}}
xiaozhi.multimodal.ocr.model-name=${MEDICAL_OCR_MODEL:qwen3.5-ocr}
xiaozhi.multimodal.ocr.connect-timeout-seconds=${MEDICAL_OCR_CONNECT_TIMEOUT_SECONDS:5}
xiaozhi.multimodal.ocr.read-timeout-seconds=${MEDICAL_OCR_READ_TIMEOUT_SECONDS:60}

# Startup validation.
xiaozhi.startup.validation.enabled=${STARTUP_VALIDATION_ENABLED:true}
xiaozhi.startup.validation.fail-fast=${STARTUP_VALIDATION_FAIL_FAST:true}

# Chat memory policy.
xiaozhi.chat-memory.max-window-messages=${CHAT_MEMORY_MAX_WINDOW_MESSAGES:20}
xiaozhi.chat-memory.min-window-messages=${CHAT_MEMORY_MIN_WINDOW_MESSAGES:4}

# DashScope online model configuration. Keys must be supplied through .env or process environment.
langchain4j.community.dashscope.chat-model.api-key=${QWEN_API_KEY:sk-ws-H.PXEPPIM.klPD.MEYCIQC8wGUM1lG_7XaFVN-ZYcV-_syEPBT_28COAbYw4f3cxwIhAItXBKrUt0kht_SQzj53K3bMBdf5_K_i74pDhUeFRNlu}
langchain4j.community.dashscope.chat-model.model-name=${QWEN_CHAT_MODEL:qwen-plus}
langchain4j.community.dashscope.chat-model.temperature=${QWEN_CHAT_TEMPERATURE:0.1}
langchain4j.community.dashscope.streaming-chat-model.api-key=${QWEN_API_KEY:sk-ws-H.PXEPPIM.klPD.MEYCIQC8wGUM1lG_7XaFVN-ZYcV-_syEPBT_28COAbYw4f3cxwIhAItXBKrUt0kht_SQzj53K3bMBdf5_K_i74pDhUeFRNlu}
langchain4j.community.dashscope.streaming-chat-model.model-name=${QWEN_STREAMING_MODEL:qwen-plus}
langchain4j.community.dashscope.streaming-chat-model.temperature=${QWEN_STREAMING_TEMPERATURE:0.1}
langchain4j.community.dashscope.embedding-model.api-key=${QWEN_API_KEY:sk-ws-H.PXEPPIM.klPD.MEYCIQC8wGUM1lG_7XaFVN-ZYcV-_syEPBT_28COAbYw4f3cxwIhAItXBKrUt0kht_SQzj53K3bMBdf5_K_i74pDhUeFRNlu}
langchain4j.community.dashscope.embedding-model.model-name=${QWEN_EMBEDDING_MODEL:text-embedding-v3}
# Do NOT set base-url here: langchain4j-community-dashscope talks the native DashScope protocol
# and appends /services/aigc/text-generation/generation to this value, so pointing it at an
# OpenAI-compatible /compatible-mode/v1 endpoint returns HTTP 404 (isJson=false, "response_error").
# Leave it unset to use the SDK default https://dashscope.aliyuncs.com/api/ with public models
# such as qwen-plus. Models served only through the dedicated MaaS workspace endpoint (qwen3.8-flash)
# require the OpenAI-compatible client instead, not these community-dashscope properties.
# Chat memory and business database.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:yy203050}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# Web search.
tavily.api-key=${TAVILY_API_KEY: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}
# Network timeouts for Tavily search (milliseconds).
tavily.connect-timeout-ms=${TAVILY_CONNECT_TIMEOUT_MS:15000}
tavily.read-timeout-ms=${TAVILY_READ_TIMEOUT_MS:45000}

# RAG content sources. Keep only reviewed Chinese patient-facing PUMCH department pages.
xiaozhi.rag.answer-generator.mode=${RAG_ANSWER_GENERATOR_MODE:online}
xiaozhi.rag.pumch-department-pages.enabled=${RAG_PUMCH_DEPARTMENT_PAGES_ENABLED:true}
xiaozhi.rag.pumch-department-pages.source-dir=${RAG_PUMCH_DEPARTMENT_PAGES_SOURCE_DIR:docs/knowledge/raw/pumch/2026-07-31/department-pages}

# Medical RAG embedding provider: deterministic for local tests, dashscope for production.
xiaozhi.rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:dashscope}

# Aliyun Elasticsearch knowledge store. It handles keyword, vector, and hybrid retrieval.
xiaozhi.elasticsearch.endpoint=${ALIYUN_ELASTICSEARCH_ENDPOINT:http://xiaozhi-c42.public.cn-beijing.es-serverless.aliyuncs.com:9200}
xiaozhi.elasticsearch.username=${ALIYUN_ELASTICSEARCH_USERNAME:xiaozhi-c42}
xiaozhi.elasticsearch.password=${ALIYUN_ELASTICSEARCH_PASSWORD:Yy203050}
xiaozhi.elasticsearch.index=${ALIYUN_ELASTICSEARCH_INDEX:xiaozhi-medical-knowledge}
xiaozhi.elasticsearch.text-analyzer=${ALIYUN_ELASTICSEARCH_TEXT_ANALYZER:ik_max_word}
xiaozhi.elasticsearch.search-analyzer=${ALIYUN_ELASTICSEARCH_SEARCH_ANALYZER:ik_max_word}
xiaozhi.elasticsearch.keyword-weight=${ALIYUN_ELASTICSEARCH_KEYWORD_WEIGHT:1.0}
xiaozhi.elasticsearch.vector-weight=${ALIYUN_ELASTICSEARCH_VECTOR_WEIGHT:1.0}
xiaozhi.elasticsearch.index.rebuild-on-startup=${ALIYUN_ELASTICSEARCH_REBUILD_ON_STARTUP:false}
xiaozhi.elasticsearch.index.marker-dir=${ALIYUN_ELASTICSEARCH_MARKER_DIR:data/rag/elasticsearch}
xiaozhi.elasticsearch.index.batch-size=${ALIYUN_ELASTICSEARCH_BATCH_SIZE:10}



# DashScope rerank. Enabled only when RAG_RERANK_PROVIDER=dashscope and QWEN_API_KEY is configured.
xiaozhi.rag.rerank.provider=${RAG_RERANK_PROVIDER:dashscope}
xiaozhi.rag.rerank.model-name=${QWEN_RERANK_MODEL:qwen3-rerank}
xiaozhi.rag.rerank.workspace-id=${QWEN_WORKSPACE_ID:ws-mkzuoap683tk9ki1}

